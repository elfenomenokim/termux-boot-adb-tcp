name: Bug report
description: Report a reproducible problem with termux-boot-adb-tcp.
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and relevant runtime
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and steps
      description: Paste the command and, for a device problem, the output of `termux-adb doctor --device HOST:PORT`. Use example addresses and remove private identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed result
    validations:
      required: true
